<script src="assets/posts.js"></script>
<script>
(function(){
  var posts = (window.POSTS||[]).slice().sort(function(a,b){return a.date<b.date?1:-1});
  var ul = document.getElementById('list');
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  ul.innerHTML = posts.map(function(p){
    var tags = (p.tags||[]).map(function(t,i){return '<span class="tag'+(i%2?' b':'')+'">'+esc(t)+'</span>'}).join('');
    return '<li><a href="posts/'+esc(p.slug)+'.html"><h2>'+esc(p.title)+'</h2><p>'+esc(p.summary)+'</p><div class="meta">'+tags+esc(p.date)+'</div></a></li>';
  }).join('');
})();
</script>
